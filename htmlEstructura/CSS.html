/* --- SECTION TARJETAS DE MENU PRINCIPALES--------- */
section {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 5em 1rem;
    perspective: 2000px;
    max-width: 1200px;
    margin: 0 auto;
}

/* --- CARD ESTILO HERO----------------------- */
.card-new {
    position: relative;
    width: 400px;
    height: 400px;
    perspective: 2000px;
    margin: 20px auto;
}

.content {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
}

.card-new:hover .content {
    transform: rotateY(180deg);
}

/* --- CARAS FRONT Y BACK --- */
.front, .back {
    position: absolute;
    height: 100%;
    width: 100%;
    backface-visibility: hidden;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.front {
    z-index: 2;
    transform: rotateY(0deg);
}

.back {
    transform: rotateY(180deg);
    background-color: var(--principal-dark);
    transform-style: preserve-3d;
    pointer-events: none;
}

/* Variantes de Color DE FONDO para el Back */
.back-1 { background: linear-gradient(135deg, #2a153c, #4a235a) !important; } /*Ciruela*/
.back-2 { background: linear-gradient(135deg, #152a3c, #1a3a5a) !important; } /*azul*/
.back-3 { background: linear-gradient(135deg, #153c2a, #1a5a3a) !important; } /*verde*/
.back-4 { background: linear-gradient(135deg, #3c1515, #5a1a1a) !important; } /*rojo*/
.back-5 { background: linear-gradient(135deg, #250a14, #d81b60) !important; } /* Rosa/Fucsia */
.back-6 { background: linear-gradient(135deg, #00251a, #00695c) !important; } /* Turquesa */
.back-7 { background: linear-gradient(135deg, #4d2600, #ff9800) !important; } /* Naranja */
.back-8 { background: linear-gradient(135deg, #4d3d00, #ffc107) !important; } /* Amarillo */

/* --- ELEMENTOS INTERNOS (HERO) --- */
.hero {
    width: 100%;
    height: 100%;
    position: relative;
    pointer-events: auto;
    transform-style: preserve-3d;
}

.hero-profile-img-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
}

.hero-profile-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.hero-profile-img-container::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, 
    rgba(0,0,0,0.1) 0%, 
    rgba(0,0,0,0.7) 50%,
    rgba(0,0,0,0.95) 100%);
    z-index: 1;
}

    transform: rotate(-10deg);

    justify-content: center;

.btn-slide span.title, .btn-slide span.title-hover {

}
.btn-slide span.title { padding-left: 35px; opacity: 1; }

/* ---ANIMACIONES DE DESPLAZAMIENTO --- */
@keyframes slideLeftRight {
    0% { transform: translateX(-120px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}
@keyframes slideRightLeft {
    from { transform: translateX(100%) rotate(-10deg); opacity: 0; }
    to { transform: translateX(0) rotate(-10deg); opacity: 1; }
}
/* --- CLASES DE COLOR PARA ICONOS --- */
.icon-clr-green {background: transparent !important;  color: #198754;}
