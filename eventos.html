<div id="content" class="container mt-4 animate__animated animate__fadeIn">
    <div class="row justify-content-center text-center">

                        <div class="card-body d-flex flex-column align-items-center p-4"> <div class="icon-circle bg-fucsia-light mb-3">
                                <i class="fi fi-rr-calendar-lines-pen" style="color: #A813B7; font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="fw-bold" style="color: #A813B7;">Registrar Nuevo Evento</h5>
                            <p class="mb-4" style="color: #A813B7; max-width: 80%;">

                            </p>
                            <button class="btn-menu rounded-pill px-4" onclick="loadContent('cargarEventos');">
                                - Cargar Eventos -
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card card-data-premium h-100 shadow-sm" style="background-color: #FAE8FF;">
                        <div class="card-body d-flex flex-column align-items-center p-4"> <div class="icon-circle bg-rose-light mb-3">
                                <i class="fi fi-rr-email-pending" style="color: #E61876; font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="fw-bold" style="color: #A813B7;">Bandeja de Entrada de Solicitudes</h5>
                            <p class="mb-4" style="color: #A813B7; max-width: 80%;">
                                Recepción y gestión de solicitudes de turnos on line.
                            </p>
                            <button class="btn-menu rounded-pill px-4" onclick="loadContent('turnos');">
                                - Bandeja de Entrada -
                            </button>

                </div>

                <div class="col-md-6">
                    <div class="card card-data-premium h-100" style="background-color: #FAE8FF;">
                        <div class="card-body d-flex flex-column align-items-center p-4">
                            <div class="icon-circle bg-green-light mb-3">
                                <i class="fi fi-rr-calendar-gavel-legal" style="color: #198754; font-size: 2.5rem;"></i>

                            <p class="mb-4" style="color: #A813B7; max-width: 80%;">
                                Verificar, editar o cancelar eventos existentes.
                            </p>
                            <button class="btn-menu rounded-pill px-4" onclick="loadContent('gestionarEventos');">
                                VER AGENDA
                            </button>
                        </div>
                    </div>
                </div>

              </div> 
            </div>

</div>
<div class="row justify-content-center mt-3 mb-2">
