<!--Incluye los estilos propios de la página -->
 <?!= include('Calendario/_cssCalendario'); ?>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="container animate__animated animate__fadeIn">
    <div class="ev-header-section">
        <div>
            <h3 class="ev-main-title"><i class="bi bi-calendar3"></i> AGENDA JURÍDICA</h3>
            <p class="ev-main-subtitle">Control de plazos y registro histórico</p>
        </div>
        <button class="ev-btn-add-main" onclick="loadContent('Calendario/cargarEvento'); return false;">
            <i class="bi bi-plus-circle"></i><span>NUEVO EVENTO</span>
        </button>
    </div>

    <div class="ev-view-selector">
        <div class="ev-switch-base">
            <button id="btnVistaPendientes" class="ev-btn-pill ev-active" onclick="cambiarVista('pendientes')">
                <i class="fi fi-rr-time-fast"></i> PENDIENTES
            </button>
            <button id="btnVistaHistorial" class="ev-btn-pill" onclick="cambiarVista('historial')">
                <i class="fi fi-rr-history"></i> HISTORIAL
            </button>
        </div>
    </div>

    <div id="contenedorEventos" class="row g-4">
        </div>
</div>

<div class="modal fade" id="modalDetalleEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content ev-mdl-content">
            <div class="modal-header ev-mdl-header">
                <h5 class="modal-title ev-mdl-title" id="tituloModalDetalle">
                    <i class="fi fi-rr-eye me-2"></i> Detalle de Agenda
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: grayscale(1) opacity(0.5);"></button>
            </div>
            <div class="modal-body ev-mdl-body" id="bodyDetalleEvento">
                </div>
            <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                <button type="button" class="ev-mdl-btn-close" data-bs-dismiss="modal">CERRAR VENTANA</button>
            </div>
        </div>
    </div>
</div>

<div class="row justify-content-center mt-3 mb-2">
  <div class="col-auto">
    <button type="button" class="btn-volver-glass-pro" onclick="loadContent('Calendario/eventos'); return false;">
      <i class="fi fi-br-angle-double-left"></i><span>VOLVER</span>
    </button>
  </div>
</div>

<script>
(function() {
    const contenedor = document.getElementById('contenedorEventos');
    let vistaActual = 'pendientes';
    let listaEventosGlobal = [];

    // --- 1. CAMBIAR ENTRE PENDIENTES E HISTORIAL ---
    window.cambiarVista = function(vista) {
        vistaActual = vista;
        
        // Actualizamos los estilos de los botones con lógica neumórfica
        const btnP = document.getElementById('btnVistaPendientes');
        const btnH = document.getElementById('btnVistaHistorial');
        
        if(vista === 'pendientes') {
            btnP.className = 'ev-btn-pill ev-active';
            btnH.className = 'ev-btn-pill';
        } else {
            btnP.className = 'ev-btn-pill';
            btnH.className = 'ev-btn-pill ev-active';
        }
        
        cargarAgenda();
    };

    // --- 2. CARGAR DATOS DESDE EL SERVIDOR ---
    function cargarAgenda() {
        // Spinner neumórfico
        contenedor.innerHTML = `
            <div class="text-center py-5 w-100">
                <div class="spinner-border" style="color: var(--ev-accent)"></div>
                <p class="mt-2 text-muted fw-bold">Sincronizando agenda jurídica...</p>
            </div>`;
        
        const successHandler = (eventos) => {
            listaEventosGlobal = eventos;
            renderizarListaTareas(eventos); // Llamada a la nueva función de dibujo
        };
        
        const failureHandler = (err) => {
            contenedor.innerHTML = `<div class="alert alert-danger mx-3">Error al obtener datos: ${err.message}</div>`;
        };

        if (vistaActual === 'pendientes') {
            google.script.run
                .withSuccessHandler(successHandler)
                .withFailureHandler(failureHandler)
                .obtenerEventos();
        } else {
            google.script.run
                .withSuccessHandler(successHandler)
                .withFailureHandler(failureHandler)
                .obtenerHistorial();
        }
    }

    // --- 3. DIBUJAR LA LISTA DE TAREAS (DISEÑO MALEWICZ) ---
    function renderizarListaTareas(eventos) {
        if (!eventos || eventos.length === 0) {
            contenedor.innerHTML = `
                <div class="col-12 text-center mt-5 py-5">
                    <i class="fi fi-rr-calendar-exclamation" style="font-size: 3rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No hay registros pendientes en la agenda.</p>
                </div>`;
            return;
        }

        contenedor.innerHTML = '';
        eventos.forEach(ev => {
            const fechaObj = new Date(ev.fecha);
            const dia = fechaObj.getDate();
            const mes = fechaObj.toLocaleDateString('es-AR', { month: 'short' }).toUpperCase().replace('.', '');
            const hora = fechaObj.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            
            // Lógica de Semáforo Neumórfico (Clases ev-)
            let claseUrgencia = 'ev-border-normal'; 
            if (ev.motivo === 'Audiencia' || ev.motivo === 'Vencimiento') {
                claseUrgencia = 'ev-border-urgente';
            } else if (ev.motivo === 'Pericia') {
                claseUrgencia = 'ev-border-aviso';
            }

            if (vistaActual === 'historial') claseUrgencia = 'ev-border-historial';

            // Template de la fila estilo Lista de Tareas
            const filaTarea = `
                <div class="col-12 animate__animated animate__fadeIn">
                    <div class="ev-task-row ${claseUrgencia}" onclick="verDetalle('${ev.id}')">
                        
                        <div class="ev-date-box">
                            <span class="ev-date-day">${dia}</span>
                            <span class="ev-date-month">${mes}</span>
                        </div>

                        <div class="ev-task-body">
                            <div class="d-flex align-items-center mb-1">
                                <span class="ev-badge-rama ${ev.tipoRama === 'ANNYA' ? 'text-annya' : 'text-particular'}">
                                    ${ev.tipoRama}
                                </span>
                                <span class="text-muted small fw-bold"><i class="bi bi-clock"></i> ${hora}</span>
                            </div>
                            <h5 class="ev-task-title">${ev.motivo}</h5>
                            <div class="ev-task-meta text-truncate">
                                <span><i class="fi fi-rr-folder-open"></i> ${ev.expediente || 'S/E'}</span>
                                <span class="d-none d-md-inline">| <i class="fi fi-rr-bank"></i> ${ev.juzgado || 'S/D'}</span>
                            </div>
                        </div>
                        
                        <div class="d-flex align-items-center" onclick="event.stopPropagation();">
                            ${vistaActual === 'pendientes' ? `
                                <button class="ev-btn-action ev-check" onclick="marcarRealizado('${ev.id}', '${ev.calId}')" title="Finalizar">
                                    <i class="fi fi-rr-check"></i>
                                </button>
                                <button class="ev-btn-action ev-trash" onclick="confirmarEliminar('${ev.id}', '${ev.calId}')" title="Eliminar">
                                    <i class="fi fi-rr-trash"></i>
                                </button>
                            ` : `<i class="fi fi-rr-check-circle text-success fs-3 ms-3"></i>`}
                        </div>
                    </div>
                </div>`;
            contenedor.innerHTML += filaTarea;
        });
    }

    // --- 4. VER DETALLE COMPLETO EN MODAL ---
    window.verDetalle = function(id) {
        const ev = listaEventosGlobal.find(e => e.id === id);
        if(!ev) return;
        
        const body = document.getElementById('bodyDetalleEvento');
        
        // Inyectamos el contenido con las tarjetas "hundidas" (neumorfismo invertido)
        body.innerHTML = `
            <div class="ev-mdl-info-card">
                <label class="ev-mdl-label">Motivo de la Cita</label>
                <h4 class="ev-mdl-text" style="color: var(--ev-accent); font-size: 1.3rem;">${ev.motivo}</h4>
            </div>

            <div class="row">
                <div class="col-6">
                    <div class="ev-mdl-info-card">
                        <label class="ev-mdl-label">Fecha y Hora</label>
                        <p class="ev-mdl-text"><i class="bi bi-calendar-check"></i> ${new Date(ev.fecha).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}</p>
                    </div>
                </div>
                <div class="col-6">
                    <div class="ev-mdl-info-card text-center">
                        <label class="ev-mdl-label">Rama / Sector</label>
                        <span class="badge-neu ${ev.tipoRama === 'ANNYA' ? 'badge-annya' : 'badge-particular'}">
                            ${ev.tipoRama}
                        </span>
                    </div>
                </div>
            </div>

            <div class="ev-mdl-info-card">
                <label class="ev-mdl-label">Expediente / Autos</label>
                <p class="ev-mdl-text">${ev.expediente || 'Sin especificar'}</p>
            </div>

            <div class="ev-mdl-info-card">
                <label class="ev-mdl-label">Ubicación y Juzgado</label>
                <p class="ev-mdl-text" style="font-size: 0.9rem;">
                    <i class="fi fi-rr-bank"></i> ${ev.juzgado || 'Dato no disponible'}
                </p>
            </div>

            <div class="ev-mdl-info-card" style="margin-bottom: 0;">
                <label class="ev-mdl-label">Observaciones</label>
                <p class="ev-mdl-text" style="font-weight: 500; font-style: italic; color: #555;">
                    ${ev.detalle || 'No hay notas adicionales para este evento.'}
                </p>
            </div>
        `;
        
        const modalElement = document.getElementById('modalDetalleEvento');
        const modalInstancia = new bootstrap.Modal(modalElement);
        modalInstancia.show();
    };

    // --- 5. MARCAR COMO REALIZADO (SWEETALERT) ---
    window.marcarRealizado = function(id, calId) {
        Swal.fire({
            title: '¿Confirmar finalización?',
            text: "El evento se moverá al historial.",
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'SÍ, FINALIZAR',
            cancelButtonText: 'CANCELAR'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

                google.script.run
                    .withSuccessHandler(res => {
                        Swal.close();
                        if(res.success) { 
                            Swal.fire({ icon: 'success', title: '¡Hecho!', timer: 1500, showConfirmButton: false });
                            cargarAgenda(); 
                        } else {
                            Swal.fire('Error', res.error, 'error');
                        }
                    })
                    .finalizarEvento(id, calId);
            }
        });
    };

    // --- 6. ELIMINAR PERMANENTEMENTE (SWEETALERT) ---
    window.confirmarEliminar = function(id, calId) {
        Swal.fire({
            title: '¿Eliminar evento?',
            text: "Esta acción es irreversible y afectará a Google Calendar.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'SÍ, ELIMINAR',
            cancelButtonText: 'CANCELAR'
        }).then((result) => {
            if (result.isConfirmed) {
                google.script.run
                    .withSuccessHandler(res => {
                        if(res.success) { 
                            Swal.fire('Eliminado', 'El evento ha sido borrado.', 'success');
                            cargarAgenda(); 
                        }
                    })
                    .eliminarEvento(id, calId);
            }
        });
    };

    // Inicio automático
    cargarAgenda();

})();
</script>
