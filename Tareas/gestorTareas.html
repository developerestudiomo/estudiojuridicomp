<div class="container mt-4 animate__animated animate__fadeIn">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bold" style="color: #8e44ad;">
                <i class="fi fi-rr-task-checklist me-2"></i>Gestor de Tareas
            </h2>
        </div>
        <div class="col-md-6 text-md-end">
            <button class="btn btn-primary rounded-pill shadow-sm me-2 px-4" onclick="abrirModalNuevaTarea()" style="background: linear-gradient(135deg, #8e44ad, #6c3483); border: none;">
                <i class="fi fi-rr-plus me-1"></i> Nueva Tarea
            </button>
            <button class="btn-menu rounded-pill shadow-sm" onclick="cargarListaTareas()">
                <i class="fi fi-rr-refresh me-1"></i> Sincronizar
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4 card-form-glass" style="border-radius: 20px;">
        <div class="card-body p-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;">
                            <i class="fi fi-rr-search text-muted"></i>
                        </span>
                        <input type="text" id="buscadorTarea" class="form-control border-start-0" 
                               placeholder="Buscar por expediente, cliente o detalle..." 
                               style="border-radius: 0 12px 12px 0;" onkeyup="filtrarTareas()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="filtroUsuario" class="form-select shadow-sm border-0" style="border-radius: 12px;" onchange="filtrarTareas()">
                        <option value="TODOS">-- TODOS LOS RESPONSABLES --</option>
                        <option value="Marcela">Marcela</option>
                        <option value="Gastón">Gastón</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filtroPrioridad" class="form-select shadow-sm border-0" style="border-radius: 12px;" onchange="filtrarTareas()">
                        <option value="TODOS">-- TODAS LAS PRIORIDADES --</option>
                        <option value="NORMAL">NORMAL</option>
                        <option value="PRIORITARIO">PRIORITARIO</option>
                        <option value="URGENTE">URGENTE</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="contenedorTareas" class="row g-3">
        <div class="col-12 text-center p-5">
            <div class="spinner-grow text-primary" role="status"></div>
            <p class="mt-2 text-muted">Obteniendo tareas pendientes...</p>
        </div>
    </div>

    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-auto">
            <button type="button" class="btn-volver-glass-pro" onclick="loadContent('Tareas/tareas'); return false;">
                <i class="fi fi-br-angle-double-left"></i><span>VOLVER</span>
            </button>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevaTarea" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-purple"><i class="fi fi-rr-edit me-2"></i>Nueva Tarea</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formNuevaTarea">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Referencia (Expediente / Cliente)</label>
                        <input type="text" id="nuevoRef" class="form-control" required style="border-radius: 10px;">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Responsable</label>
                            <select id="nuevoResp" class="form-select" style="border-radius: 10px;">
                                <option value="Marcela">Marcela</option>
                                <option value="Gastón">Gastón</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Prioridad</label>
                            <select id="nuevoPrio" class="form-select" style="border-radius: 10px;">
                                <option value="NORMAL">NORMAL</option>
                                <option value="PRIORITARIO">PRIORITARIO</option>
                                <option value="URGENTE">URGENTE</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Fecha Límite</label>
                        <input type="date" id="nuevoFecha" class="form-control" required style="border-radius: 10px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Detalle</label>
                        <textarea id="nuevoDetalle" class="form-control" rows="3" required style="border-radius: 10px;"></textarea>
                    </div>
                    <button type="button" class="btn btn-success w-100 rounded-pill py-2" onclick="guardarNuevaTarea()">Guardar Tarea</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarTarea" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-purple"><i class="fi fi-rr-pencil me-2"></i>Gestionar Tarea</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formEditarTarea">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Referencia</label>
                        <input type="text" id="editRef" class="form-control" required style="border-radius: 10px;">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Responsable</label>
                            <select id="editResp" class="form-select" style="border-radius: 10px;">
                                <option value="Marcela">Marcela</option>
                                <option value="Gastón">Gastón</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Prioridad</label>
                            <select id="editPrio" class="form-select" style="border-radius: 10px;">
                                <option value="NORMAL">NORMAL</option>
                                <option value="PRIORITARIO">PRIORITARIO</option>
                                <option value="URGENTE">URGENTE</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Fecha Límite</label>
                        <input type="text" id="editFecha" class="form-control" required style="border-radius: 10px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Detalle</label>
                        <textarea id="editDetalle" class="form-control" rows="3" required style="border-radius: 10px;"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-success w-50 rounded-pill py-2" onclick="actualizarTarea()">Actualizar</button>
                        <button type="button" class="btn btn-outline-danger w-50 rounded-pill py-2" onclick="confirmarCierreTareaDesdeModal()">Finalizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
var TODAS_LAS_TAREAS = [];
let modalNuevaInstance, modalEditarInstance;

(function initGestor() {
    setTimeout(function() {
        cargarListaTareas();
        modalNuevaInstance = new bootstrap.Modal(document.getElementById('modalNuevaTarea'));
        modalEditarInstance = new bootstrap.Modal(document.getElementById('modalEditarTarea'));
    }, 300);
})();

function cargarListaTareas() {
    const contenedor = document.getElementById('contenedorTareas');
    if (!contenedor) return;

    google.script.run
        .withSuccessHandler(function(tareas) {
            TODAS_LAS_TAREAS = tareas;
            renderizarGestorTareas(tareas);
        })
        .withFailureHandler(function(err) {
            contenedor.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error al cargar datos: ${err.message}</div></div>`;
        })
        .getListaTareas();
}

function renderizarGestorTareas(tareas) {
    const cont = document.getElementById('contenedorTareas');
    if (!tareas || tareas.length === 0) {
        cont.innerHTML = '<div class="col-12 text-center p-5"><p class="text-muted">No hay tareas pendientes.</p></div>';
        return;
    }

    let html = '';
    tareas.forEach(t => {
        let badgeColor = 'bg-secondary';
        let bordeEstilo = 'border-start border-4 border-success';
        if (t.prioridad === 'URGENTE') {
            badgeColor = 'bg-danger';
            bordeEstilo = 'border-start border-4 border-danger';
        } else if (t.prioridad === 'PRIORITARIO') {
            badgeColor = 'bg-warning text-dark';
            bordeEstilo = 'border-start border-4 border-warning';
        }

        html += `
        <div class="col-12 col-md-6 col-lg-4 animate__animated animate__fadeIn">
            <div class="card h-100 shadow-sm task-card-interactive ${bordeEstilo}" onclick="abrirModalEditar('${t.id}')">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge ${badgeColor} px-3 py-2 rounded-pill">${t.prioridad}</span>
                        <small class="text-muted fw-bold"><i class="fi fi-rr-calendar me-1"></i>${t.fechaFin}</small>
                    </div>
                    <h5 class="fw-bold text-dark mb-1">${t.referencia}</h5>
                    <p class="small text-muted mb-3"><i class="fi fi-rr-user me-1"></i><b>Resp:</b> ${t.usuario}</p>
                    <div class="bg-light p-3 rounded-3 mb-3" style="min-height:60px">
                        <p class="small text-secondary mb-0">${t.detalle}</p>
                    </div>
                    <button class="btn btn-success btn-sm w-100 rounded-pill py-2 shadow-sm" onclick="event.stopPropagation(); confirmarCierreTarea('${t.id}')">
                        <i class="fi fi-rr-check me-1"></i> Finalizar
                    </button>
                </div>
            </div>
        </div>`;
    });
    cont.innerHTML = html;
}

function filtrarTareas() {
    const busqueda = document.getElementById('buscadorTarea').value.toLowerCase();
    const usuario = document.getElementById('filtroUsuario').value;
    const prioridad = document.getElementById('filtroPrioridad').value;

    const filtradas = TODAS_LAS_TAREAS.filter(t => {
        const coincideTexto = t.referencia.toLowerCase().includes(busqueda) || t.detalle.toLowerCase().includes(busqueda);
        const coincideUser = (usuario === 'TODOS' || t.usuario === usuario);
        const coincidePrio = (prioridad === 'TODOS' || t.prioridad === prioridad);
        return coincideTexto && coincideUser && coincidePrio;
    });
    renderizarGestorTareas(filtradas);
}

function abrirModalNuevaTarea() {
    document.getElementById('formNuevaTarea').reset();
    modalNuevaInstance.show();
}

function guardarNuevaTarea() {
    const datos = {
        referencia: document.getElementById('nuevoRef').value,
        usuario: document.getElementById('nuevoResp').value,
        prioridad: document.getElementById('nuevoPrio').value,
        fechaFin: document.getElementById('nuevoFecha').value,
        detalle: document.getElementById('nuevoDetalle').value
    };

    google.script.run
        .withSuccessHandler(() => {
            modalNuevaInstance.hide();
            Swal.fire({ icon: 'success', title: 'Tarea creada', timer: 1500, showConfirmButton: false });
            cargarListaTareas();
        })
        .withFailureHandler((err) => {
            Swal.fire('Error', err.message, 'error');
        })
        .guardarNuevaTareaServidor(datos);
}

function abrirModalEditar(id) {
    const tarea = TODAS_LAS_TAREAS.find(t => t.id == id);
    if (!tarea) return;

    document.getElementById('editId').value = tarea.id;
    document.getElementById('editRef').value = tarea.referencia;
    document.getElementById('editResp').value = tarea.usuario;
    document.getElementById('editPrio').value = tarea.prioridad;
    document.getElementById('editFecha').value = tarea.fechaFin;
    document.getElementById('editDetalle').value = tarea.detalle;

    modalEditarInstance.show();
}

function actualizarTarea() {
    const datos = {
        id: document.getElementById('editId').value,
        referencia: document.getElementById('editRef').value,
        usuario: document.getElementById('editResp').value,
        prioridad: document.getElementById('editPrio').value,
        fechaFin: document.getElementById('editFecha').value,
        detalle: document.getElementById('editDetalle').value
    };

    google.script.run
        .withSuccessHandler(() => {
            modalEditarInstance.hide();
            Swal.fire({ icon: 'success', title: 'Actualizado', timer: 1500, showConfirmButton: false });
            cargarListaTareas();
        })
        .withFailureHandler((err) => {
            Swal.fire('Error', err.message, 'error');
        })
        .actualizarTareaServidor(datos);
}

function confirmarCierreTareaDesdeModal() {
    const id = document.getElementById('editId').value;
    modalEditarInstance.hide();
    confirmarCierreTarea(id);
}

function confirmarCierreTarea(id) {
    Swal.fire({
        title: '¿Finalizar tarea?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, cerrar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#28a745'
    }).then((result) => {
        if (result.isConfirmed) {
            google.script.run
                .withSuccessHandler(() => {
                    Swal.fire({ icon: 'success', title: 'Finalizada', timer: 1500, showConfirmButton: false });
                    cargarListaTareas();
                })
                .finalizarTareaServidor(id);
        }
    });
}


</script>
