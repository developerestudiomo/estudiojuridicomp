          <div class="modal fade" id="modalNuevaTarea" tabindex="-1" aria-hidden="true">

              <div class="modal-content rounded-4 border-0 shadow">

                    <div class="row g-3">
                      <div class="col-md-4">

                        <input type="text" id="t_fInicio" class="form-control" readonly disabled>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label small fw-bold">FECHA FIN</label>
                        <input type="date" id="t_fFin" class="form-control">
                      </div>
                      <div class="col-md-4">
                        <label class="form-label small fw-bold">ASIGNAR A</label>
                        <select id="t_usuario" class="form-select">
                          <option value="Marcela">Marcela</option>
                          <option value="Gastón">Gastón</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label small fw-bold">CATEGORÍA</label>
                        <select id="t_cat" class="form-select" onchange="toggleSeccionExpedientes()">
                          <option value="Expedientes">Sobre Expedientes</option>
                          <option value="Otras">Otras tareas</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label small fw-bold">PRIORIDAD</label>
                        <select id="t_prioridad" class="form-select">
                          <option value="NORMAL">🟢 NORMAL</option>
                          <option value="PRIORITARIO">🟠 PRIORITARIO</option>
                          <option value="URGENTE">🔴 URGENTE</option>
                        </select>
                      </div>

                      <div class="col-12" id="div_otra_desc" style="display:none;">
                        <label class="form-label small fw-bold">DESCRIPCIÓN DE LA TAREA (BREVE)</label>
                        <input type="text" id="t_desc_manual" class="form-control" placeholder="Ej: Pago de tasas administrativas">
                      </div>

                      <div id="div_exp_cascada" class="row g-2 mt-1">
                        <div class="col-md-6">

                            <option value="ANNYA">ANNYA</option>
                            <option value="PARTICULAR">PARTICULAR</option>
                          </select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label small fw-bold">FUERO</label>
                          <select id="t_fuero" class="form-select" disabled onchange="actualizarDeptosTarea()"></select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label small fw-bold">DPTO</label>
                          <select id="t_depto" class="form-select" disabled onchange="actualizarExpedientesTarea()"></select>
                        </div>
                        <div class="col-md-6">
