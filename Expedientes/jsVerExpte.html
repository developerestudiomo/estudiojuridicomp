<script>
    (function() {
        const tipo = sessionStorage.getItem('tipoGestionActiva');
        const badge = document.getElementById('gestionBadge');
        if (badge && tipo) {
              const isAnnya = tipo === 'ANNYA';
              badge.textContent = tipo;
              const labelExtra = document.getElementById('expedienteTipoLabel');
              if(labelExtra) labelExtra.textContent = tipo;

              [badge, labelExtra].forEach(el => {
                  if (!el) return;
                  el.classList.remove('badge', 'text-bg-primary', 'text-bg-success', 'text-bg-info', 'rounded-pill');
                  el.classList.add('badge-sunset', 'badge-pulse');
                  if (isAnnya) {
                      el.style.background = "linear-gradient(135deg, #b07d8a 0%, #8a5a67 100%)";
                      el.style.boxShadow = "0 4px 12px rgba(138, 90, 103, 0.4)";
                  } else {
                      el.style.background = "linear-gradient(135deg, #0d9488 0%, #065f46 100%)";
                      el.style.boxShadow = "0 4px 12px rgba(13, 148, 136, 0.4)";
                  }
              });
          }

        document.getElementById('btnVolver').onclick = () => {
            const dest = 'dataExpedientes';
            if (typeof loadContent === 'function') loadContent(dest);
            else if (parent && typeof parent.loadContent === 'function') parent.loadContent(dest);
        };

        const ssId = sessionStorage.getItem('activeSpreadsheetId');
        const sheetName = sessionStorage.getItem('activeSheetName');
        if (ssId && sheetName) cargarDatos(ssId, sheetName);
    })();

    function cargarDatos(manualSsId, manualSheetName) {
        const urlParams = new URLSearchParams(window.location.search);
        const finalSsId = manualSsId || urlParams.get('ssId');
        const finalSheetName = manualSheetName || urlParams.get('sheet');

        const fuero = sessionStorage.getItem('fueroSeleccionado');      
        const depto = sessionStorage.getItem('deptoSeleccionado');      
        const tipo = sessionStorage.getItem('tipoCasoSeleccionado');

        google.script.run
            .withSuccessHandler(function(response) {
              const loaderH = document.getElementById('loadingHeader');
              const loaderT = document.getElementById('loadingTable');
              if (loaderH) loaderH.style.display = 'none';
              if (loaderT) loaderT.style.display = 'none';
              
              if (response.success) {
                  const h = response.header || {}; 
                  const folderInput = document.getElementById('expedienteFolderId');
                  if (folderInput) folderInput.value = h.folderId || "";
                  
                  if (h.folderId) sessionStorage.setItem('activeFolderId', h.folderId);

                  const updateText = (id, val) => {
                      const el = document.getElementById(id);
                      if (el) el.textContent = val || "S/D";
                  };
                  updateText('fueroId', h.fueroId);
                  updateText('juzgadoName', h.juzgadoName);
                  updateText('expedienteNumero', h.expedienteNumero);
                  updateText('expedienteCaratula', h.caratula);

                  const details = document.getElementById('expedienteDetails');
                  if (details) details.style.display = 'flex';
                  const tableCont = document.getElementById('novedadesTableContainer');
                  if (tableCont) tableCont.style.display = 'block';
                  
                  renderTable(response.headers, response.novedades);
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: response.error });
                }
          })
          .withFailureHandler(err => {
              Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
          })
          .getListData(finalSsId, finalSheetName, fuero, depto, tipo);
      }

    function renderTable(headers, data) {
        const tableSelector = '#novedadesTable';
        if ($.fn.DataTable.isDataTable(tableSelector)) {
            $(tableSelector).DataTable().destroy();
            $(tableSelector).empty();
        }

        const columns = headers.map(h => ({ 
            title: h,
            className: h.toUpperCase() === 'FECHA' ? 'text-center font-bold' : 'text-left'
        }));

        $(tableSelector).DataTable({
            data: data,
            columns: columns,
            order: [[0, "desc"]],
            language: { url: 'https://cdn.datatables.net/plug-ins/1.10.21/i18n/Spanish.json' }
        });
    }

    function abrirModalNovedad() {
        const fechaInput = document.getElementById('fechaNovedad');
        const textoInput = document.getElementById('textoNovedad');
        const fileInput = document.getElementById('documentFiles');
        const listaAdjuntos = document.getElementById('listaPreviaAdjuntos');

        if (fechaInput) fechaInput.valueAsDate = new Date();
        if (textoInput) textoInput.value = "";
        if (fileInput) fileInput.value = "";
        if (listaAdjuntos) listaAdjuntos.innerHTML = "";
        
        const status = document.getElementById('uploadStatus');
        if (status) { status.style.display = 'none'; status.innerHTML = ""; }

        const progressArea = document.getElementById('progressArea');
        if (progressArea) progressArea.classList.add('hidden');

        const modalEl = document.getElementById('modalNovedad');
        if (modalEl) {
            const myModal = new bootstrap.Modal(modalEl);
            myModal.show();
        }
    }

    async function guardarYSubir() {
        const btn = document.getElementById('btnGuardarNovedad');
        const files = document.getElementById('documentFiles').files;
        const folderId = document.getElementById('expedienteFolderId').value;
        const prefijo = document.getElementById('prefijoNovedad').value;
        const detalle = document.getElementById('textoNovedad').value.trim();
        const textoFinal = prefijo + detalle;
        const ssId = sessionStorage.getItem('activeSpreadsheetId');
        const sheetName = sessionStorage.getItem('activeSheetName');

        if (!detalle) {
            Swal.fire({ icon: 'warning', title: 'Atención', text: 'Ingrese el detalle.' });
            return;
        }

        btn.disabled = true;
        Swal.fire({ title: 'Guardando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        google.script.run
            .withSuccessHandler(async (response) => {
                if (response.error) {
                    Swal.fire('Error', response.error, 'error');
                    btn.disabled = false;
                    return;
                }

                try {
                    if (files.length > 0 && folderId) {
                        for (let i = 0; i < files.length; i++) {
                            Swal.update({ title: `Subiendo ${i+1}/${files.length}`, html: files[i].name });
                            const base64 = await fileToBase64(files[i]);
                            await new Promise((res, rej) => {
                                google.script.run.withSuccessHandler(res).withFailureHandler(rej)
                                    .uploadBase64File(base64, files[i].type, files[i].name, folderId);
                            });
                        }
                    }
                    Swal.fire({ icon: 'success', title: 'Guardado', timer: 1500, showConfirmButton: false });
                    setTimeout(cerrarYRefrescar, 1500);
                } catch (err) {
                    Swal.fire('Error en archivos', err.message, 'warning');
                    btn.disabled = false;
                }
            })
            .withFailureHandler(err => {
                Swal.fire('Error', err.message, 'error');
                btn.disabled = false;
            })
            .addNovedadExpediente(ssId, sheetName, document.getElementById('fechaNovedad').value, textoFinal);
    }

    function cerrarYRefrescar() {
        const modalEl = document.getElementById('modalNovedad');
        const m = bootstrap.Modal.getInstance(modalEl);
        
        if (m) {
            m.hide();
        }

        // Esperamos un momento a que la animación de Bootstrap termine
        setTimeout(() => {
            const form = document.getElementById('formNovedad');
            if (form) form.reset();

            // Forzamos la recuperación del scroll
            forzarLimpiezaBody();

            // Refrescamos los datos de la tabla
            const ssId = sessionStorage.getItem('activeSpreadsheetId');
            const sheetName = sessionStorage.getItem('activeSheetName');
            cargarDatos(ssId, sheetName);
        }, 300); // 300ms es el tiempo estándar de la transición de Bootstrap
    }

    // FUNCIÓN MAESTRA DE LIMPIEZA
    function forzarLimpiezaBody() {
        document.body.classList.remove('modal-open');
        document.body.classList.remove('stop-scroll');
        document.body.style.overflow = '';
        document.body.style.paddingRight = '';
        
        // Eliminamos cualquier "backdrop" huérfano (la sombra oscura)
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(b => b.remove());
    }

    function mostrarArchivosSeleccionados() {
        const cont = document.getElementById('listaPreviaAdjuntos');
        cont.innerHTML = "";
        Array.from(document.getElementById('documentFiles').files).forEach(f => {
            cont.innerHTML += `<span class="badge bg-light text-dark border p-2 small">${f.name}</span>`;
        });
    }

    function prepararExplorador() {
        const fId = document.getElementById('expedienteFolderId').value || sessionStorage.getItem('activeFolderId');
        if (fId && fId !== "null") {
            abrirExplorador(fId);
        } else {
            alert("No se encontró la carpeta de Drive.");
        }
    }

    function abrirExplorador(folderId) {
    const modalArchivos = document.getElementById('modalArchivos');
    const lista = document.getElementById('listaArchivos');
    modalArchivos.style.display = "block";
    document.body.classList.add('stop-scroll'); 
    
    lista.innerHTML = '<div class="col-span-2 text-center p-10"><div class="spinner-border text-primary"></div><br>Accediendo a Drive...</div>';

    google.script.run
        .withSuccessHandler(archivos => {
            lista.innerHTML = "";
            if (!archivos || archivos.length === 0) {
                lista.innerHTML = "<div class='col-span-2 text-center text-muted'>La carpeta está vacía.</div>";
                return;
            }
            
            archivos.forEach(file => {
                let card = document.createElement('div');
                card.className = "file-card-neu";
                const icon = file.nombre.toLowerCase().endsWith('.pdf') ? 'bi-file-pdf text-danger' : 'bi-file-image text-primary';
                
                card.innerHTML = `
                    <i class="bi ${icon}" style="font-size: 2rem;"></i>
                    <div class="font-bold truncate" style="font-size: 10px; margin-top: 5px;">${file.nombre}</div>
                `;
                
                card.onclick = () => {
                    const v = document.getElementById('visorDrive');
                    v.src = file.embedUrl;
                    v.classList.remove('hidden');
                    document.getElementById('mensajeVisor').style.display = "none";
                };
                lista.appendChild(card);
            });
        })
        .listarArchivosExpediente(folderId);
}

    function cerrarModal() {
        // 1. Ocultar el div manual
        document.getElementById('modalArchivos').style.display = "none";
        document.getElementById('visorDrive').src = "";

        // 2. Verificar si el modal de novedades sigue abierto
        const modalNovedad = document.getElementById('modalNovedad');
        const isNovedadOpen = modalNovedad.classList.contains('show');

        if (!isNovedadOpen) {
            // Si no hay más modales abiertos, limpiamos el body a la fuerza
            forzarLimpiezaBody();
        } else {
            // Si el de novedades sigue abierto, nos aseguramos que él tenga el foco
            // Esto evita que el scroll se pierda al estar el explorador encima
            document.body.classList.add('modal-open');
        }
    }
</script>
