/* Neumorphic Input Styles */
.form-group {
    margin-bottom: 28px;
    position: relative;
}

.neu-input {
    position: relative;
    background: #e0e5ec;
    border-radius: 15px;
    box-shadow: inset 8px 8px 16px #bec3cf, inset -8px -8px 16px #ffffff;
    margin-bottom: 1.5rem; /* Espaciado entre inputs */
    overflow: hidden;
}

.neu-input input, 
.neu-input textarea {
    width: 100%;
    background: transparent;
    border: none;
    padding: 28px 24px 12px 24px; /* Aumentamos padding superior para dejar espacio al label */
    color: #3d4468;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    display: block;
}

/* Ajuste para inputs tipo fecha y número que tienen iconos internos */
.neu-input input[type="date"] {
    min-height: 60px;
}

.neu-input label {
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    color: #9499b7;
    font-size: 14px;
    pointer-events: none;
    transition: all 0.3s ease;
    margin: 0; /* Elimina márgenes de Bootstrap que rompen la posición */
}

/* Animación: Cuando hay foco o el input no está vacío */
.neu-input input:focus + label,
.neu-input input:not(:placeholder-shown) + label,
.neu-input textarea:focus + label,
