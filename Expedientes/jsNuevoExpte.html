<script>
(function() {
    class ExpedienteManager {
        constructor() {
            // Elementos Principales
            this.container = document.getElementById('nuevoExpedienteContainer');
            this.form = document.getElementById('loginForm');
            this.submitBtn = document.getElementById('btnSubmitEvento');
            this.tipoDisplay = document.getElementById('tipoCasoDisplay');
            
            // Selectores
            this.fueroSel = document.getElementById('fueroSelector');
            this.deptoSel = document.getElementById('departamentoSelector');
            this.juzSel = document.getElementById('juzgadoSelector');

            // Inputs de Archivos
            this.fileInput = document.getElementById('documentFiles');
            this.uploadBtn = document.getElementById('uploadFilesBtn');

            if (this.container) this.init();
        }

        init() {
            this.setupTypeSelectors();
            this.setupChainLogic();
            this.setupFormSubmission();
            this.setupFileUploadLogic(); // <-- SECCIÓN INTEGRADA
        }

      setupTypeSelectors() {
          document.querySelectorAll('input[name="tipoCasoMaestro"]').forEach(radio => {
              radio.addEventListener('change', (e) => {
                  const val = e.target.value;
                  this.tipoDisplay.value = val;
                  
                  // Definimos la paleta según el tipo
                  const isAnnya = (val === 'ANNYA');
                  const colorMain = isAnnya ? '#ef66b6' : '#00897b'; // Rosa vs Teal
                  const colorDark = isAnnya ? '#ae4482' : '#07665c';
                  this.container.querySelector('.header-paso-1').style.backgroundColor = colorMain;
                  this.container.querySelector('.indicator-container').style.borderLeftColor = colorMain;
                  this.container.querySelector('.indicator-label').style.color = colorMain;
                  this.container.querySelector('.indicator-input').style.color = colorDark;

                  document.documentElement.style.setProperty('--principal-bg-dynamic', colorMain);

                  this.resetSelectors();
                  this.fetchFueros(val);
              });
          });
      }

        resetSelectors() {
            this.fueroSel.disabled = true;
            this.fueroSel.innerHTML = '<option selected disabled>Cargando...</option>';
            this.deptoSel.disabled = true;
            this.deptoSel.innerHTML = '<option selected disabled>-- SELECCIONE DPTO --</option>';
            this.juzSel.disabled = true;
            this.juzSel.innerHTML = '<option selected disabled>-- SELECCIONE JUZGADO --</option>';
        }

        fetchFueros(tipo) {
            google.script.run.withSuccessHandler(f => {
                this.fueroSel.innerHTML = '<option selected disabled>-- SELECCIONE FUERO --</option>';
                if(f) f.sort().forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item; opt.textContent = item;
                    this.fueroSel.appendChild(opt);
                });
                this.fueroSel.disabled = false;
                this.fueroSel.dispatchEvent(new Event('change'));
            }).getFuerosDesdeDrive(tipo);
        }

        setupChainLogic() {
            this.fueroSel.onchange = () => {
                const tipo = document.querySelector('input[name="tipoCasoMaestro"]:checked').value;
                this.deptoSel.disabled = true;
                this.deptoSel.innerHTML = '<option>Cargando...</option>';
                google.script.run.withSuccessHandler(d => {
                    this.deptoSel.innerHTML = '<option selected disabled>-- SELECCIONE DPTO --</option>';
                    if(d) d.forEach(p => {
                        let opt = document.createElement('option');
                        opt.value = p; opt.textContent = p;
                        this.deptoSel.appendChild(opt);
                    });
                    this.deptoSel.disabled = false;
                }).getDepartamentosJudiciales(this.fueroSel.value, tipo);
            };

            this.deptoSel.onchange = () => {
                const tipo = document.querySelector('input[name="tipoCasoMaestro"]:checked').value;
                document.getElementById('prefijo').value = this.deptoSel.value;
                this.juzSel.disabled = true;
                this.juzSel.innerHTML = '<option>Cargando...</option>';
                google.script.run.withSuccessHandler(j => {
                    this.juzSel.innerHTML = '<option selected disabled>-- SELECCIONE JUZGADO --</option>';
                    if(j) j.forEach(item => {
                        let opt = document.createElement('option');
                        opt.value = item.id; opt.textContent = item.name;
                        opt.setAttribute('data-folder', item.folderId);
                        this.juzSel.appendChild(opt);
                    });
                    this.juzSel.disabled = false;
                }).getExpedientesFromDrive(this.fueroSel.value, this.deptoSel.value, tipo);
            };

            this.juzSel.onchange = () => {
                const selected = this.juzSel.options[this.juzSel.selectedIndex];
                document.getElementById('selectedJuzgadoId').value = this.juzSel.value;
                document.getElementById('selectedJuzgadoName').value = selected.textContent;
                document.getElementById('selectedJuzgadoFolderId').value = selected.getAttribute('data-folder');
            };
        }

        setupFormSubmission() {
            this.form.onsubmit = (e) => {
                e.preventDefault();
                const tipoCheck = document.querySelector('input[name="tipoCasoMaestro"]:checked');
                if(!tipoCheck || !this.juzSel.value) {
                    Swal.fire('Atención', 'Complete la clasificación del caso (Paso 1)', 'warning');
                    return;
                }

                this.setLoading(true);
                const data = {
                    fueroId: this.fueroSel.value,
                    juzgadoId: document.getElementById('selectedJuzgadoId').value,
                    juzgadoName: document.getElementById('selectedJuzgadoName').value,
                    juzgadoFolderId: document.getElementById('selectedJuzgadoFolderId').value,
                    sheetName: `${document.getElementById('prefijo').value}-${document.getElementById('numeroReceptoria').value}-${document.getElementById('anio').value}`,
                    caratula: document.getElementById('caratula').value.toUpperCase(),
                    fechaInicial: document.getElementById('fechaInicial').value,
                    novedadesIniciales: document.getElementById('novedadesIniciales').value,
                    prefijo: document.getElementById('prefijo').value,
                    numeroReceptoria: document.getElementById('numeroReceptoria').value,
                    anio: document.getElementById('anio').value,
                    tipoCaso: tipoCheck.value
                };

                google.script.run.withSuccessHandler(res => {
                    this.setLoading(false);
                    if(res && res.error) return Swal.fire('Error', res.error, 'error');
                    
                    document.getElementById('expedienteFolderId').value = res.folderId;
                    document.getElementById('newExpteNameDisplay').textContent = data.sheetName;
                    const modalConfirm = new bootstrap.Modal(document.getElementById('confirmUploadModal'));
                    modalConfirm.show();
                }).createNewExpedienteSheet(data);
            };
        }

        setupFileUploadLogic() {
          if(this.fileInput) {
              this.fileInput.onchange = () => {
                  const count = this.fileInput.files.length;
                  document.getElementById('fileLabel').textContent = count > 0 ? `${count} archivos seleccionados` : 'Seleccionar archivos';
              };
          }

          if(this.uploadBtn) {
              this.uploadBtn.onclick = () => {
                  const files = this.fileInput.files;
                  const folderId = document.getElementById('expedienteFolderId').value;

                  if (files.length === 0) return Swal.fire('Atención', 'Adjunte archivos para subir', 'warning');

                  this.uploadBtn.disabled = true;
                  this.uploadBtn.textContent = "SUBIENDO...";
                  document.getElementById('progressArea').classList.remove('hidden');

                  let uploadedCount = 0;
                  Array.from(files).forEach(file => {
                      const reader = new FileReader();
                      reader.onload = (e) => {
                          const content = e.target.result.split(',')[1];
                          google.script.run.withSuccessHandler((res) => {
                              if (res && res.success) {
                                  uploadedCount++;
                                  let percent = Math.round((uploadedCount / files.length) * 100);
                                  document.getElementById('progressBar').style.width = percent + '%';
                                  document.getElementById('progressPercent').textContent = percent + '%';
                                  if (uploadedCount === files.length) {
                                      Swal.fire({
                                          title: '¡Expediente Digitalizado!',
                                          text: 'Los archivos se vincularon correctamente al Drive.',
                                          icon: 'success',
                                          confirmButtonColor: '#7e22ce',
                                          confirmButtonText: 'FINALIZAR',
                                          allowOutsideClick: false
                                      }).then((result) => {
                                          if (result.isConfirmed) {
                                              const modalUpload = bootstrap.Modal.getInstance(document.getElementById('uploadFilesModal'));
                                              if(modalUpload) modalUpload.hide();
                                              if (typeof loadContent === 'function') {
                                                  loadContent('Expedientes/gestionExpte'); 
                                              } else {
                                                  window.location.reload();
                                              }
                                          }
                                      });
                                  }
                              }
                          }).uploadBase64File(content, file.type, file.name, folderId);
                      };
                      reader.readAsDataURL(file);
                  });
              };
          }
      }

          setLoading(isLoading) {
              if (!this.submitBtn) return;

              // Buscamos el icono/texto y el loader
              const btnIcon = this.submitBtn.querySelector('.fi-rr-disk');
              const btnLoader = this.submitBtn.querySelector('.btn-loader');

              this.submitBtn.disabled = isLoading;

              if (isLoading) {
                  this.submitBtn.classList.add('loading-active');
                  if (btnIcon) btnIcon.style.display = 'none';
                  if (btnLoader) btnLoader.style.display = 'block';
              } else {
                  this.submitBtn.classList.remove('loading-active');
                  if (btnIcon) btnIcon.style.display = 'inline-block';
                  if (btnLoader) btnLoader.style.display = 'none';
              }
          }
    }

    window.startUploadProcess = function() {
        const modalConfirmEl = document.getElementById('confirmUploadModal');
        const modalConfirm = bootstrap.Modal.getInstance(modalConfirmEl);
        if(modalConfirm) modalConfirm.hide();
        
        const modalUpload = new bootstrap.Modal(document.getElementById('uploadFilesModal'));
        modalUpload.show();
    };

    const initManager = () => { window.expedienteManager = new ExpedienteManager(); };
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        initManager();
    } else {
        document.addEventListener('DOMContentLoaded', initManager);
    }
})();
</script>
