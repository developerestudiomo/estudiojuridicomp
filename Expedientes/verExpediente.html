<!---verExpediente.html--->
<div id="content" class="container mt-4">
    <input type="hidden" id="expedienteFolderId">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
           <h2 class="text-3xl font-extrabold tracking-tight title-expediente">
                DETALLES DEL <span class="subtitle-expediente" style="color: var(--principal-dark);">EXPEDIENTES EN CURSO</span>
                <p class="text-muted mb-0">Gestión y seguimiento de actuaciones</p>
            </h2>
        </div>
        <div id="gestionBadgeContainer">
            <span id="gestionBadge" class="badge-sunset badge-pulse"></span>
        </div>
    </div>

    <div id="headerInfo" class="card-form-glass shadow-xl mb-6 overflow-hidden border border-gray-100">
        <div class="card-body bg-white">
            <div id="loadingHeader" class="text-center my-3">
                <div class="spinner-grow text-primary" role="status"></div>
                <p class="mt-2 text-muted fw-bold">Sincronizando con Drive...</p>
            </div>
            
            <div class="row g-0 px-4 py-6 rounded-3xl bg-white shadow-xl" id="expedienteDetails" style="display: none;">
                <div class="col-md-3">
                    <div class="info-group">
                        <label class="labelFormsTitle">Juzgado</label>
                        <div class="p-view flex items-center gap-2 mt-2">
                            <i class="fi fi-tr-family-dress icon-clr-pink icon-circle text-lg"></i> 
                            <span class="font-bold text-gray-800">
                                <span id="fueroId"></span> - <span id="juzgadoName"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="col-md-2 border-r border-gray-100 px-4">
                    <div class="info-group">
                        <label class="labelFormsTitle mt-2">N° Expediente</label>
                        <p class="p-view font-black text-lg text-orange-600 align-items-start" id="expedienteNumero">-</p>
                    </div>
                </div>

                <div class="col-md-2 border-r border-gray-100 px-4">
                    <div class="info-group">
                        <label class="labelFormsTitle mb-2 block">Tipo Caso</label>
                        <div class="flex justify-center md:justify-start">
                            <span id="expedienteTipoLabel" class="badge-sunset badge-pulse">-</span>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 px-4">
                    <div class="info-group">
                        <label class="labelFormsTitle">Carátula</label>
                        <p class="p-view-caratula" id="expedienteCaratula">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="barras-titles flex items-center justify-between text-white p-4 header-paso-1" style="background: var(--principal);">
            <span class="text-white fw-bold"><i class="bi bi-journal-text me-2"></i>HISTORIAL DE ACCIONES</span>
            <div class="justify-end">
              <button class="btn-actions-barra rounded-pill px-4" onclick="abrirModalNovedad()" title="Agregar Novedad">
                  <i class="fi fi-tr-files-medical icon-clr-orange"></i>
              </button>
            </div>
        </div>

        <div class="card-body p-0">
            <div id="loadingTable" class="text-center my-5">
                <div class="neu-spinner mx-auto"></div> 
                <p class="text-xs font-bold text-gray-400 mt-2 uppercase tracking-widest">Cargando Novedades...</p>
            </div>

            <div class="card-data-premium" id="novedadesTableContainer" style="display: none;">
                <table id="novedadesTable" class="table w-100">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="row justify-content-center mt-3 mb-2">
  <div class="col-auto">
    <button type="button" class="btn-volver-glass-pro" id="btnVolver">
      <i class="fi fi-br-angle-double-left"></i><span>VOLVER</span>
    </button>
  </div>
</div>  

<!-------------------MODAL CARGA NOVEDADES---->
<div class="modal fade" id="modalNovedad" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content neu-modal-card">
            <div class="p-4 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="neu-btn p-3 rounded-full text-2xl" style="width:60px; height:60px; display:flex; align-items:center; justify-content:center;">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <h2 class="text-2xl font-black uppercase tracking-tighter">
                        Registrar <span style="color: var(--principal);">Novedad</span>
                    </h2>
                </div>
                <button type="button" class="neu-btn p-2 px-3" data-bs-dismiss="modal">×</button>
            </div>

            <div class="modal-body p-5">
                <form id="formNovedad" class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-4 flex flex-column gap-4">
                        <div class="flex flex-column gap-2">
                            <label class="text-xs font-bold px-2">¿QUIÉN SE EXPIDE?</label>
                            <select class="neu-input-field" id="prefijoNovedad" required>
                                <option value="" selected>Texto libre</option>
                                <option value="Juzgado dispone: ">Juzgado dispone:</option>
                                <option value="Perito informa: ">Perito informa:</option>
                                <option value="ANNYA Manifiesta: ">ANNYA Manifiesta:</option>
                            </select>
                        </div>
                        <div class="flex flex-column gap-2">
                            <label class="text-xs font-bold px-2">FECHA DEL ACTO</label>
                            <input type="date" class="neu-input-field" id="fechaNovedad" required>
                        </div>
                        
                        <div class="mt-4">
                            <input type="file" id="documentFiles" multiple class="hidden" onchange="mostrarArchivosSeleccionados()">
                            <label for="documentFiles" class="neu-btn block p-8 text-center cursor-pointer border-dashed border-2 border-gray-300">
                                <i class="bi bi-cloud-upload text-3xl block mb-2"></i>
                                <span class="text-sm font-bold">ADJUNTAR ARCHIVOS</span>
                            </label>
                            <div id="listaPreviaAdjuntos" class="mt-4 flex flex-wrap gap-2"></div>
                            
                            <div id="uploadStatus" class="mt-2 small text-center" style="display:none;"></div>
                            <div id="progressArea" class="hidden mt-2"></div>
                        </div>
                    </div>

                    <div class="md:col-span-8">
                        <label class="text-xs font-bold px-2 mb-2 block">DETALLE DE LA NOVEDAD</label>
                        <textarea class="neu-input-field w-full h-[350px] resize-none" id="textoNovedad" placeholder="Escriba aquí la actualización..."></textarea>
                    </div>
                </form>
            </div>

            <div class="p-4 flex justify-end gap-4 border-t border-gray-200">
                <button type="button" class="neu-btn px-6 py-2" onclick="prepararExplorador()">
                    <i class="bi bi-folder-search me-2"></i>VER ARCHIVOS
                </button>
                <button type="button" class="neu-btn px-10 py-2 bg-white" id="btnGuardarNovedad" onclick="guardarYSubir()" style="color: var(--principal-dark);">
                    GUARDAR CAMBIOS
                </button>
            </div>
        </div>
    </div>
</div>

<!-------MODAL CARGA ARCHIVOS---------------->
<div id="modalArchivos" class="modal-custom-visor" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; z-index: 1050; background: rgba(224, 229, 236, 0.9); backdrop-filter: blur(10px);">
    <div class="modal-visor-content neu-modal-card" style="width: 90%; max-width: 1400px; height: 85vh; margin: 5vh auto; overflow: hidden; display: flex; flex-direction: column;">
        <div class="p-4 flex justify-between items-center border-b">
            <h5 class="font-black m-0"><i class="bi bi-folder2-open me-2"></i>EXPEDIENTE DIGITAL</h5>
            <button type="button" class="neu-btn px-3 py-1" onclick="cerrarModal()">CERRAR EXPLORADOR</button>
        </div>

        <div class="flex flex-grow overflow-hidden">
            <div class="w-1/3 p-4 overflow-y-auto border-r border-gray-200" id="listaArchivosContainer">
                <div id="listaArchivos" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <div class="w-2/3 p-4 bg-gray-100 flex flex-column relative">
                <div id="mensajeVisor" class="m-auto text-center">
                    <div class="neu-btn p-10 rounded-full inline-block mb-4">
                        <i class="bi bi-file-earmark-pdf text-6xl text-gray-400"></i>
                    </div>
                    <p class="font-bold text-gray-500">Seleccione un documento para visualizarlo</p>
                </div>
                <iframe id="visorDrive" src="" class="w-full h-full rounded-xl shadow-inner hidden border-none"></iframe>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const tipo = sessionStorage.getItem('tipoGestionActiva');
        const badge = document.getElementById('gestionBadge');
        if (badge && tipo) {
              const isAnnya = tipo === 'ANNYA';
              badge.textContent = tipo;
              const labelExtra = document.getElementById('expedienteTipoLabel');
              if(labelExtra) labelExtra.textContent = tipo;

              [badge, labelExtra].forEach(el => {
                  if (!el) return;
                  el.classList.remove('badge', 'text-bg-primary', 'text-bg-success', 'text-bg-info', 'rounded-pill');
                  el.classList.add('badge-sunset', 'badge-pulse');
                  if (isAnnya) {
                      el.style.background = "linear-gradient(135deg, #b07d8a 0%, #8a5a67 100%)";
                      el.style.boxShadow = "0 4px 12px rgba(138, 90, 103, 0.4)";
                  } else {
                      el.style.background = "linear-gradient(135deg, #0d9488 0%, #065f46 100%)";
                      el.style.boxShadow = "0 4px 12px rgba(13, 148, 136, 0.4)";
                  }
              });
          }

        document.getElementById('btnVolver').onclick = () => {
            const dest = 'dataExpedientes';
            if (typeof loadContent === 'function') loadContent(dest);
            else if (parent && typeof parent.loadContent === 'function') parent.loadContent(dest);
        };

        const ssId = sessionStorage.getItem('activeSpreadsheetId');
        const sheetName = sessionStorage.getItem('activeSheetName');
        if (ssId && sheetName) cargarDatos(ssId, sheetName);
    })();

    function cargarDatos(manualSsId, manualSheetName) {
        const urlParams = new URLSearchParams(window.location.search);
        const finalSsId = manualSsId || urlParams.get('ssId');
        const finalSheetName = manualSheetName || urlParams.get('sheet');

        const fuero = sessionStorage.getItem('fueroSeleccionado');      
        const depto = sessionStorage.getItem('deptoSeleccionado');      
        const tipo = sessionStorage.getItem('tipoCasoSeleccionado');

        google.script.run
            .withSuccessHandler(function(response) {
              const loaderH = document.getElementById('loadingHeader');
              const loaderT = document.getElementById('loadingTable');
              if (loaderH) loaderH.style.display = 'none';
              if (loaderT) loaderT.style.display = 'none';
              
              if (response.success) {
                  const h = response.header || {}; 
                  const folderInput = document.getElementById('expedienteFolderId');
                  if (folderInput) folderInput.value = h.folderId || "";
                  
                  if (h.folderId) sessionStorage.setItem('activeFolderId', h.folderId);

                  const updateText = (id, val) => {
                      const el = document.getElementById(id);
                      if (el) el.textContent = val || "S/D";
                  };
                  updateText('fueroId', h.fueroId);
                  updateText('juzgadoName', h.juzgadoName);
                  updateText('expedienteNumero', h.expedienteNumero);
                  updateText('expedienteCaratula', h.caratula);

                  const details = document.getElementById('expedienteDetails');
                  if (details) details.style.display = 'flex';
                  const tableCont = document.getElementById('novedadesTableContainer');
                  if (tableCont) tableCont.style.display = 'block';
                  
                  renderTable(response.headers, response.novedades);
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: response.error });
                }
          })
          .withFailureHandler(err => {
              Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
          })
          .getListData(finalSsId, finalSheetName, fuero, depto, tipo);
      }

    function renderTable(headers, data) {
        const tableSelector = '#novedadesTable';
        if ($.fn.DataTable.isDataTable(tableSelector)) {
            $(tableSelector).DataTable().destroy();
            $(tableSelector).empty();
        }

        const columns = headers.map(h => ({ 
            title: h,
            className: h.toUpperCase() === 'FECHA' ? 'text-center font-bold' : 'text-left'
        }));

        $(tableSelector).DataTable({
            data: data,
            columns: columns,
            order: [[0, "desc"]],
            language: { url: 'https://cdn.datatables.net/plug-ins/1.10.21/i18n/Spanish.json' }
        });
    }

    function abrirModalNovedad() {
        const fechaInput = document.getElementById('fechaNovedad');
        const textoInput = document.getElementById('textoNovedad');
        const fileInput = document.getElementById('documentFiles');
        const listaAdjuntos = document.getElementById('listaPreviaAdjuntos');

        if (fechaInput) fechaInput.valueAsDate = new Date();
        if (textoInput) textoInput.value = "";
        if (fileInput) fileInput.value = "";
        if (listaAdjuntos) listaAdjuntos.innerHTML = "";
        
        const status = document.getElementById('uploadStatus');
        if (status) { status.style.display = 'none'; status.innerHTML = ""; }

        const progressArea = document.getElementById('progressArea');
        if (progressArea) progressArea.classList.add('hidden');

        const modalEl = document.getElementById('modalNovedad');
        if (modalEl) {
            const myModal = new bootstrap.Modal(modalEl);
            myModal.show();
        }
    }

    async function guardarYSubir() {
        const btn = document.getElementById('btnGuardarNovedad');
        const files = document.getElementById('documentFiles').files;
        const folderId = document.getElementById('expedienteFolderId').value;
        const prefijo = document.getElementById('prefijoNovedad').value;
        const detalle = document.getElementById('textoNovedad').value.trim();
        const textoFinal = prefijo + detalle;
        const ssId = sessionStorage.getItem('activeSpreadsheetId');
        const sheetName = sessionStorage.getItem('activeSheetName');

        if (!detalle) {
            Swal.fire({ icon: 'warning', title: 'Atención', text: 'Ingrese el detalle.' });
            return;
        }

        btn.disabled = true;
        Swal.fire({ title: 'Guardando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        google.script.run
            .withSuccessHandler(async (response) => {
                if (response.error) {
                    Swal.fire('Error', response.error, 'error');
                    btn.disabled = false;
                    return;
                }

                try {
                    if (files.length > 0 && folderId) {
                        for (let i = 0; i < files.length; i++) {
                            Swal.update({ title: `Subiendo ${i+1}/${files.length}`, html: files[i].name });
                            const base64 = await fileToBase64(files[i]);
                            await new Promise((res, rej) => {
                                google.script.run.withSuccessHandler(res).withFailureHandler(rej)
                                    .uploadBase64File(base64, files[i].type, files[i].name, folderId);
                            });
                        }
                    }
                    Swal.fire({ icon: 'success', title: 'Guardado', timer: 1500, showConfirmButton: false });
                    setTimeout(cerrarYRefrescar, 1500);
                } catch (err) {
                    Swal.fire('Error en archivos', err.message, 'warning');
                    btn.disabled = false;
                }
            })
            .withFailureHandler(err => {
                Swal.fire('Error', err.message, 'error');
                btn.disabled = false;
            })
            .addNovedadExpediente(ssId, sheetName, document.getElementById('fechaNovedad').value, textoFinal);
    }

    function cerrarYRefrescar() {
        const modalEl = document.getElementById('modalNovedad');
        const m = bootstrap.Modal.getInstance(modalEl);
        
        if (m) {
            m.hide();
        }

        // Esperamos un momento a que la animación de Bootstrap termine
        setTimeout(() => {
            const form = document.getElementById('formNovedad');
            if (form) form.reset();

            // Forzamos la recuperación del scroll
            forzarLimpiezaBody();

            // Refrescamos los datos de la tabla
            const ssId = sessionStorage.getItem('activeSpreadsheetId');
            const sheetName = sessionStorage.getItem('activeSheetName');
            cargarDatos(ssId, sheetName);
        }, 300); // 300ms es el tiempo estándar de la transición de Bootstrap
    }

    // FUNCIÓN MAESTRA DE LIMPIEZA
    function forzarLimpiezaBody() {
        document.body.classList.remove('modal-open');
        document.body.classList.remove('stop-scroll');
        document.body.style.overflow = '';
        document.body.style.paddingRight = '';
        
        // Eliminamos cualquier "backdrop" huérfano (la sombra oscura)
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(b => b.remove());
    }

    function mostrarArchivosSeleccionados() {
        const cont = document.getElementById('listaPreviaAdjuntos');
        cont.innerHTML = "";
        Array.from(document.getElementById('documentFiles').files).forEach(f => {
            cont.innerHTML += `<span class="badge bg-light text-dark border p-2 small">${f.name}</span>`;
        });
    }

    function prepararExplorador() {
        const fId = document.getElementById('expedienteFolderId').value || sessionStorage.getItem('activeFolderId');
        if (fId && fId !== "null") {
            abrirExplorador(fId);
        } else {
            alert("No se encontró la carpeta de Drive.");
        }
    }

    function abrirExplorador(folderId) {
    const modalArchivos = document.getElementById('modalArchivos');
    const lista = document.getElementById('listaArchivos');
    modalArchivos.style.display = "block";
    document.body.classList.add('stop-scroll'); 
    
    lista.innerHTML = '<div class="col-span-2 text-center p-10"><div class="spinner-border text-primary"></div><br>Accediendo a Drive...</div>';

    google.script.run
        .withSuccessHandler(archivos => {
            lista.innerHTML = "";
            if (!archivos || archivos.length === 0) {
                lista.innerHTML = "<div class='col-span-2 text-center text-muted'>La carpeta está vacía.</div>";
                return;
            }
            
            archivos.forEach(file => {
                let card = document.createElement('div');
                card.className = "file-card-neu";
                const icon = file.nombre.toLowerCase().endsWith('.pdf') ? 'bi-file-pdf text-danger' : 'bi-file-image text-primary';
                
                card.innerHTML = `
                    <i class="bi ${icon}" style="font-size: 2rem;"></i>
                    <div class="font-bold truncate" style="font-size: 10px; margin-top: 5px;">${file.nombre}</div>
                `;
                
                card.onclick = () => {
                    const v = document.getElementById('visorDrive');
                    v.src = file.embedUrl;
                    v.classList.remove('hidden');
                    document.getElementById('mensajeVisor').style.display = "none";
                };
                lista.appendChild(card);
            });
        })
        .listarArchivosExpediente(folderId);
}

    function cerrarModal() {
        // 1. Ocultar el div manual
        document.getElementById('modalArchivos').style.display = "none";
        document.getElementById('visorDrive').src = "";

        // 2. Verificar si el modal de novedades sigue abierto
        const modalNovedad = document.getElementById('modalNovedad');
        const isNovedadOpen = modalNovedad.classList.contains('show');

        if (!isNovedadOpen) {
            // Si no hay más modales abiertos, limpiamos el body a la fuerza
            forzarLimpiezaBody();
        } else {
            // Si el de novedades sigue abierto, nos aseguramos que él tenga el foco
            // Esto evita que el scroll se pierda al estar el explorador encima
            document.body.classList.add('modal-open');
        }
    }
</script>
