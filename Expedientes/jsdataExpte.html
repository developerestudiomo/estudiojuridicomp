<script>
(function() {
    // Referencias seguras
    const getMsg = () => document.getElementById('loadingMessage');
    const getCont = () => document.getElementById('tableContainer');

    // Botón Volver - Respetando tu ID y diseño original
    const btnCambiar = document.getElementById('btncambiarJuzgado');
    if (btnCambiar) {
        btnCambiar.onclick = function(e) {
            if (e) e.preventDefault();
            const dest = 'Expedientes/seleccionarExpedientes';
            if (typeof loadContent === 'function') loadContent(dest);
            else if (window.parent && typeof window.parent.loadContent === 'function') window.parent.loadContent(dest);
        };
    }

    const ssId = sessionStorage.getItem('activeSpreadsheetId');
    const juzgadoNombre = sessionStorage.getItem('activeJuzgadoName');
    
    const label = document.getElementById('juzgadoLabel');
    if (label && juzgadoNombre) label.textContent = juzgadoNombre;

    if (ssId) {
        cargarDatos(ssId);
    }

    function cargarDatos(id) {
        const msg = getMsg();
        const cont = getCont();
        if (msg) {
            msg.style.display = 'block';
            msg.innerHTML = '<p>Cargando información...</p>';
        }
        if (cont) cont.style.display = 'none';

        google.script.run
            .withSuccessHandler(res => {
                if (res && res.success) {
                    renderTable(res.headers, res.data);
                } else {
                    if (msg) msg.innerHTML = '<p class="text-danger">Error al cargar datos</p>';
                }
            })
            .withFailureHandler(() => {
                if (msg) msg.innerHTML = '<p class="text-danger">Fallo de conexión</p>';
            })
            .getData(id, 'INDICE');
    }

    function renderTable(headers, data) {
        const tableElement = $('#tableExpedientes');
        const msg = getMsg();
        const cont = getCont();
        
        if ($.fn.DataTable.isDataTable('#tableExpedientes')) {
            tableElement.DataTable().destroy();
            tableElement.empty();
        }

        const columns = headers.map(h => ({ title: h.toUpperCase() }));
        columns.push({ title: "ACCIONES", orderable: false, className: "text-center" });

        // Simplificamos el string de botones para evitar errores de tokens inesperados
        const tableData = data.map(fila => {
            const expte = fila[0]; 
            const btnHtml = '<div class="d-flex justify-content-center gap-2">' +
                '<button class="btn-view" onclick="verDetalle(\'' + expte + '\')"><i class="bi bi-eye"></i></button>' +
                '<button class="btn-marca btn-delete-accion" data-nro="' + expte + '"><i class="bi bi-trash3"></i></button>' +
                '</div>';
            return [...fila, btnHtml];
        });

        tableElement.DataTable({
            data: tableData,
            columns: columns,
            language: { url: 'https://cdn.datatables.net/plug-ins/1.10.21/i18n/Spanish.json' },
            dom: 'rtip',
            drawCallback: function() {
                $('.btn-delete-accion').off('click').on('click', function() {
                    const nro = $(this).attr('data-nro');
                    if (typeof confirmarEliminar === 'function') confirmarEliminar(nro);
                });
            }
        });

        if (msg) msg.style.display = 'none';
        if (cont) cont.style.display = 'block';
    }

    // Definimos la función dentro del scope para que sea accesible
    window.confirmarEliminar = function(nroExpte) {
        Swal.fire({
            title: '¿Eliminar expediente?',
            text: 'Se borrará el registro ' + nroExpte + ' permanentemente.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                const id = sessionStorage.getItem('activeSpreadsheetId');
                google.script.run
                    .withSuccessHandler(res => {
                        if(res.success) {
                            Swal.fire('Eliminado', '', 'success');
                            cargarDatos(id); 
                        }
                    })
                    .eliminarExpedienteCompleto(id, nroExpte);
            }
        });
    };
})();

function verDetalle(nro) {
    sessionStorage.setItem('activeSheetName', nro);
    const dest = 'Expedientes/verExpediente';
    if (typeof loadContent === 'function') loadContent(dest);
    else if (window.parent && typeof window.parent.loadContent === 'function') window.parent.loadContent(dest);
}
</script>
