<!---gestorTareas.html----------------------->
<div class="container mt-4 animate__animated animate__fadeIn">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bold" style="color: #8e44ad;">
                <i class="fi fi-rr-task-checklist me-2"></i>Gestor de Tareas
            </h2>
        </div>
        <div class="col-md-6 text-md-end">
            <button class="btn-menu rounded-pill shadow-sm" onclick="cargarListaTareas()">
                <i class="fi fi-rr-refresh me-1"></i> Sincronizar
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px; background: #f8f9fa;">
        <div class="card-body p-3">
            <div class="row g-3">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 10px 0 0 10px;">
                            <i class="fi fi-rr-search text-muted"></i>
                        </span>
                        <input type="text" id="buscadorTarea" class="form-control border-start-0" 
                               placeholder="Buscar por expediente, cliente o detalle..." 
                               style="border-radius: 0 10px 10px 0;" onkeyup="filtrarTareas()">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="filtroUsuario" class="form-select" style="border-radius: 10px;" onchange="filtrarTareas()">
                        <option value="TODOS">-- TODOS LOS RESPONSABLES --</option>
                        <option value="Marcela">Marcela</option>
                        <option value="Gastón">Gastón</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="contenedorTareas" class="row g-3">
        <div class="col-12 text-center p-5">
            <div class="spinner-grow text-primary" role="status"></div>
            <p class="mt-2 text-muted">Obteniendo tareas pendientes...</p>
        </div>
    </div>

    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-auto">
            <button type="button" class="btn-volver-glass-pro" onclick="loadContent('tareas'); return false;">
                <i class="fi fi-br-angle-double-left"></i><span>VOLVER</span>
            </button>
        </div>
    </div>
</div>

<script>
var TODAS_LAS_TAREAS = [];

(function initGestor() {
        console.log("LOG: Iniciando componente Gestor de Tareas...");
        // Pequeño delay para asegurar que el DOM está listo en el main-content
        setTimeout(function() {
            cargarListaTareas();
        }, 300);
    })();

    function cargarListaTareas() {
        const contenedor = document.getElementById('contenedorTareas');
        if (!contenedor) {
            console.error("LOG: No se encontró el contenedor de tareas");
            return;
        }

        console.log("LOG: Llamando a getListaTareas en el servidor...");
        
        google.script.run
            .withSuccessHandler(function(tareas) {
                console.log("LOG: Tareas recibidas del servidor:", tareas.length);
                TODAS_LAS_TAREAS = tareas;
                renderizarGestorTareas(tareas);
            })
            .withFailureHandler(function(err) {
                console.error("LOG: Error en servidor:", err);
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            Error al cargar datos: ${err.message}
                        </div>
                    </div>`;
            })
            .getListaTareas();
    }

    function renderizarGestorTareas(tareas) {
        const cont = document.getElementById('contenedorTareas');
        if (!tareas || tareas.length === 0) {
            cont.innerHTML = '<div class="col-12 text-center p-5"><p class="text-muted">No hay tareas pendientes.</p></div>';
            return;
        }

        let html = '';
        tareas.forEach(t => {
            let colorBorde = 'border-success';
            if (t.prioridad === 'URGENTE') colorBorde = 'border-danger border-start border-4';
            if (t.prioridad === 'PRIORITARIO') colorBorde = 'border-warning border-start border-4';

            html += `
            <div class="col-12 col-md-6 col-lg-4 animate__animated animate__fadeIn">
                <div class="card h-100 shadow-sm border-0 ${colorBorde}" style="border-radius: 15px;">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-light text-dark border">${t.prioridad}</span>
                            <small class="text-muted">${t.fechaFin}</small>
                        </div>
                        <h6 class="fw-bold text-primary mb-1">${t.referencia}</h6>
                        <p class="small text-muted mb-2"><b>Resp:</b> ${t.usuario}</p>
                        <div class="bg-light p-2 rounded mb-3" style="min-height:50px">
                            <p class="small mb-0">${t.detalle}</p>
                        </div>
                        <button class="btn btn-success btn-sm w-100 rounded-pill" onclick="confirmarCierreTarea('${t.id}')">
                            Finalizar
                        </button>
                    </div>
                </div>
            </div>`;
        });
        cont.innerHTML = html;
    }

    function filtrarTareas() {
        const busqueda = document.getElementById('buscadorTarea').value.toLowerCase();
        const usuario = document.getElementById('filtroUsuario').value;

        const filtradas = TODAS_LAS_TAREAS.filter(t => {
            const coincideTexto = t.referencia.toLowerCase().includes(busqueda) || t.detalle.toLowerCase().includes(busqueda);
            const coincideUser = (usuario === 'TODOS' || t.usuario === usuario);
            return coincideTexto && coincideUser;
        });
        renderizarGestorTareas(filtradas);
    }

    function confirmarCierreTarea(id) {
        Swal.fire({
            title: '¿Finalizar?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Sí, cerrar'
        }).then((result) => {
            if (result.isConfirmed) {
                google.script.run
                    .withSuccessHandler(() => {
                        Swal.fire('Hecho', '', 'success');
                        cargarListaTareas();
                    })
                    .finalizarTareaServidor(id);
            }
        });
    }
</script>
