<!---nuevoCliente.html--->
<div class="card card-data-premium animate__animated animate__fadeIn">
    <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #ED6AFF;">
        <h5 class="mb-0"><i class="fi fi-rr-user-add"></i> REGISTRO PROFESIONAL DE CLIENTE</h5>
    </div>

    <div class="card-body">
        <form id="formNuevoCliente">
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="labelInputFormNew">FECHA DE ALTA:</label>
                    <input type="date" id="fechaRegistro" class="input-form-premium" readonly>
                </div>
                <div class="col-md-8">
                    <label class="labelInputFormNew d-block text-center">¿VINCULAR A EXPEDIENTE EXISTENTE?</label>
                    <div class="btn-group-select d-flex gap-3 justify-content-center w-100" role="group">
                        <input type="radio" class="btn-check" name="expIniciado" id="expSi" value="SI" onchange="toggleExpediente(true)">
                        <label class="btn-menu btn-sm w-50" for="expSi">
                            <i class="fi fi-rr-link"></i> SÍ, VINCULAR
                        </label>
                        
                        <input type="radio" class="btn-check" name="expIniciado" id="expNo" value="NO" checked onchange="toggleExpediente(false)">
                        <label class="btn-menu btn-sm w-50" for="expNo">
                            <i class="fi fi-rr-cross-circle"></i> NO, ES NUEVO
                        </label>
                    </div>
                </div>
            </div>

            <div id="sectorExpediente" class="p-3 mb-4 d-none" style="background-color: #fdf7ff; border: 1px dashed #ED6AFF; border-radius: 15px;">
                <p class="small fw-bold text-center" style="color: #ED6AFF;"><i class="fi fi-rr-search"></i> LOCALIZACIÓN JERÁRQUICA EN DRIVE</p>
                
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="labelInputFormNew">RAMA:</label>
                        <select id="selectRamaCli" class="input-form-premium" onchange="cargarFuerosCli()">
                            <option value="">-- SELECCIONE --</option>
                            <option value="PARTICULAR">PARTICULAR</option>
                            <option value="ANNYA">ANNYA</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="labelInputFormNew">FUERO:</label>
                        <select id="selectFueroCli" class="input-form-premium" onchange="cargarDeptosCli()" disabled>
                            <option value="">Esperando Rama...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="labelInputFormNew">DEPTO. JUDICIAL:</label>
                        <select id="selectDeptoCli" class="input-form-premium" onchange="cargarJuzgadosCli()" disabled>
                            <option value="">Esperando Fuero...</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5">
                        <label class="labelInputFormNew">N° JUZGADO:</label>
                        <select id="selectJuzgadoCli" class="input-form-premium" onchange="cargarExpedientesCli()" disabled>
                            <option value="">Esperando Depto...</option>
                        </select>
                    </div>
                    <div class="col-md-7">
                        <label class="labelInputFormNew">SELECCIONAR EXPEDIENTE:</label>
                        <select id="selectExpedienteCli" class="input-form-premium" disabled style="border-color: #AD46FF;">
                            <option value="">Esperando Juzgado...</option>
                        </select>
                    </div>
                </div>
            </div>

            <hr>
            <h6 class="fw-bold mb-3" style="color: #ED6AFF;">DATOS PERSONALES DEL CLIENTE</h6>

            <div class="row mb-3">
                <div class="col-md-7">
                    <label class="labelInputFormNew">NOMBRE Y APELLIDO:</label>
                    <input type="text" id="nombreCli" class="input-form-premium" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="col-md-5">
                    <label class="labelInputFormNew">DNI / CUIT:</label>
                    <input type="text" id="dniCli" class="input-form-premium" placeholder="Sin puntos ni guiones">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="labelInputFormNew">WHATSAPP / CEL:</label>
                    <input type="tel" id="telCli" class="input-form-premium" placeholder="+54 9...">
                </div>
                <div class="col-md-8">
                    <label class="labelInputFormNew">CORREO ELECTRÓNICO:</label>
                    <input type="email" id="emailCli" class="input-form-premium" placeholder="ejemplo@correo.com">
                </div>
            </div>

            <div class="mb-3">
                <label class="labelInputFormNew">DOMICILIO (REAL / CONSTITUIDO):</label>
                <textarea id="domicilioCli" class="input-form-premium" rows="2"></textarea>
            </div>

            <div class="text-end mt-4 d-flex justify-content-end gap-2">
                <button type="button" class="btn-menu rounded-pill px-4" onclick="loadContent('Convenios/convenios'); return false;">
                    <i class="fi fi-rr-document-signed"></i> CONVENIO
                </button>
                <button type="button" class="btn-menu rounded-pill px-4" onclick="enviarCliente(event)">
                    <i class="fi fi-rr-disk"></i> GUARDAR CLIENTE
                </button>
            </div>
        </form>
    </div>
</div>

<div class="row justify-content-center mt-3 mb-2">
  <div class="col-auto">
    <button type="button" class="btn-volver-glass-pro" onclick="loadContent('Clientes/clientes'); return false;">
      <i class="fi fi-br-angle-double-left"></i><span>VOLVER</span>
    </button>
  </div>
</div>

<script>
document.getElementById('fechaRegistro').value = new Date().toISOString().split('T')[0];

    //Mostrar/Ocultar sector de expediente
    function toggleExpediente(mostrar) {
        const sector = document.getElementById('sectorExpediente');
        mostrar ? sector.classList.remove('d-none') : sector.classList.add('d-none');
    }

    //Recolectar y enviar datos
function enviarCliente(e) {
    if (e) e.preventDefault(); 

    const btn = event.currentTarget;
    const nombre = document.getElementById('nombreCli').value.trim();

    if (!nombre) {
        Swal.fire({
            icon: 'warning',
            title: 'Dato faltante',
            text: 'Por favor, ingrese al menos el nombre del cliente.',
            confirmButtonColor: '#8e44ad'
        }).then(() => {
            document.getElementById('nombreCli').focus();
        });
        return;
    }

    Swal.fire({
        title: 'Registrando cliente...',
        text: 'Guardando información en la base de datos',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    const originalHTML = btn.innerHTML;
    btn.disabled = true;

    const datos = {
        fecha: document.getElementById('fechaRegistro').value,
        nombre: nombre,
        dni: document.getElementById('dniCli').value,
        tel: document.getElementById('telCli').value,
        email: document.getElementById('emailCli').value,
        domicilio: document.getElementById('domicilioCli').value,
        expediente: document.getElementById('expSi').checked ? 
                    document.getElementById('selectExpedienteCli').value : "SIN VINCULAR"
    };

    google.script.run
        .withSuccessHandler(res => {
            if(res.success) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Cliente Registrado!',
                    text: `Se ha generado el ID: ${res.id}`,
                    timer: 2500,
                    showConfirmButton: false,
                    customClass: { popup: 'rounded-4' }
                });
                
                setTimeout(() => loadContent('Clientes/gestorClientes'), 2000);
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error al guardar',
                    text: res.error,
                    confirmButtonColor: '#d33'
                });
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        })
        .withFailureHandler(err => {
            Swal.fire({
                icon: 'error',
                title: 'Fallo de conexión',
                text: 'No se pudo contactar con el servidor: ' + err,
                confirmButtonColor: '#d33'
            });
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        })
        .guardarCliente(datos);
}

// --- LÓGICA DE SELECTORES EN CASCADA ---
    
    function cargarFuerosCli() {
        const rama = document.getElementById('selectRamaCli').value;
        const f = document.getElementById('selectFueroCli');
        if(!rama) return;
        f.innerHTML = '<option>Cargando...</option>'; f.disabled = false;
        google.script.run.withSuccessHandler(res => {
            f.innerHTML = '<option value="">-- SELECCIONE FUERO --</option>';
            res.forEach(item => f.innerHTML += `<option value="${item.id}">${item.name}</option>`);
        }).getFuerosDriveRaiz(rama);
    }

    function cargarDeptosCli() {
        const fueroId = document.getElementById('selectFueroCli').value;
        const d = document.getElementById('selectDeptoCli');
        d.innerHTML = '<option>Cargando...</option>'; d.disabled = false;
        google.script.run.withSuccessHandler(res => {
            d.innerHTML = '<option value="">-- SELECCIONE DEPTO --</option>';
            res.forEach(item => d.innerHTML += `<option value="${item.id}">${item.name}</option>`);
        }).getDeptosJudiciales(fueroId);
    }

    function cargarJuzgadosCli() {
        const fueroId = document.getElementById('selectFueroCli').value;
        const deptoId = document.getElementById('selectDeptoCli').value;
        const j = document.getElementById('selectJuzgadoCli');
        j.innerHTML = '<option>Cargando...</option>'; j.disabled = false;
        google.script.run.withSuccessHandler(res => {
            j.innerHTML = '<option value="">-- SELECCIONE JUZGADO --</option>';
            res.forEach(item => j.innerHTML += `<option value="${item.id}">${item.name}</option>`);
        }).getExptesFromDrive(fueroId, deptoId);
    }

    function cargarExpedientesCli() {
        const juzgadoId = document.getElementById('selectJuzgadoCli').value;
        const e = document.getElementById('selectExpedienteCli');
        e.innerHTML = '<option>Cargando...</option>'; e.disabled = false;
        google.script.run.withSuccessHandler(res => {
            e.innerHTML = '<option value="">-- SELECCIONE EXPEDIENTE --</option>';
            res.forEach(item => e.innerHTML += `<option value="${item}">${item}</option>`);
        }).getListaExptesdeId(juzgadoId);
    }
</script>
