<!--Incluye los estilos propios de la página -->
 <?!= include('Clientes/_cssClientes'); ?>
<div class="lex-registro-container animate__animated animate__fadeIn">
    
    <div class="lex-registro-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fi fi-rr-user-add"></i> REGISTRO PROFESIONAL</h5>
    </div>

    <div class="card-body p-0">
        <form id="formNuevoCliente">
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="lex-registro-label">FECHA DE ALTA:</label>
                    <input type="date" id="fechaRegistro" class="lex-registro-input" readonly>
                </div>
                <div class="col-md-8">
                    <label class="lex-registro-label text-center w-100">¿VINCULAR A EXPEDIENTE EXISTENTE?</label>
                    <div class="d-flex gap-3 justify-content-center">
                        <input type="radio" class="btn-check" name="expIniciado" id="expSi" value="SI" onchange="toggleExpediente(true)">
                        <label class="lex-btn-premium w-50 text-center" for="expSi">
                            <i class="fi fi-rr-link"></i> VINCULAR
                        </label>
                        
                        <input type="radio" class="btn-check" name="expIniciado" id="expNo" value="NO" checked onchange="toggleExpediente(false)">
                        <label class="lex-btn-premium w-50 text-center" for="expNo">
                            <i class="fi fi-rr-cross-circle"></i> NUEVO
                        </label>
                    </div>
                </div>
            </div>

            <div id="sectorExpediente" class="lex-registro-subsector mb-4 d-none">
                <p class="small fw-bold text-center" style="color: #682ed5;"><i class="fi fi-rr-search"></i> LOCALIZACIÓN EN DRIVE</p>
                
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="lex-registro-label">RAMA:</label>
                        <select id="selectRamaCli" class="lex-registro-input" onchange="cargarFuerosCli()">
                            <option value="">-- SELECCIONE --</option>
                            <option value="PARTICULAR">PARTICULAR</option>
                            <option value="ANNYA">ANNYA</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="lex-registro-label">FUERO:</label>
                        <select id="selectFueroCli" class="lex-registro-input" onchange="cargarDeptosCli()" disabled>
                            <option value="">Esperando Rama...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="lex-registro-label">DEPTO. JUDICIAL:</label>
                        <select id="selectDeptoCli" class="lex-registro-input" onchange="cargarJuzgadosCli()" disabled>
                            <option value="">Esperando Fuero...</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5">
                        <label class="lex-registro-label">N° JUZGADO:</label>
                        <select id="selectJuzgadoCli" class="lex-registro-input" onchange="cargarExpedientesCli()" disabled>
                            <option value="">Esperando Depto...</option>
                        </select>
                    </div>
                    <div class="col-md-7">
                        <label class="lex-registro-label">EXPEDIENTE:</label>
                        <select id="selectExpedienteCli" class="lex-registro-input" disabled style="border-left: 3px solid #682ed5;">
                            <option value="">Esperando Juzgado...</option>
                        </select>
                    </div>
                </div>
            </div>

            <h6 class="fw-bold mb-3 mt-4" style="color: #682ed5; border-left: 3px solid #682ed5; padding-left: 10px;">DATOS PERSONALES</h6>

            <div class="row mb-3">
                <div class="col-md-7">
                    <label class="lex-registro-label">NOMBRE Y APELLIDO:</label>
                    <input type="text" id="nombreCli" class="lex-registro-input" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="col-md-5">
                    <label class="lex-registro-label">DNI / CUIT:</label>
                    <input type="text" id="dniCli" class="lex-registro-input" placeholder="Sin puntos ni guiones">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="lex-registro-label">WHATSAPP / CEL:</label>
                    <input type="tel" id="telCli" class="lex-registro-input" placeholder="+54 9...">
                </div>
                <div class="col-md-8">
                    <label class="lex-registro-label">CORREO ELECTRÓNICO:</label>
                    <input type="email" id="emailCli" class="lex-registro-input" placeholder="ejemplo@correo.com">
                </div>
            </div>

            <div class="mb-3">
                <label class="lex-registro-label">DOMICILIO (REAL / CONSTITUIDO):</label>
                <textarea id="domicilioCli" class="lex-registro-input" rows="2"></textarea>
            </div>

            <div class="text-end mt-5 d-flex justify-content-end gap-3">
                <button type="button" class="lex-btn-premium lex-btn-cancel" onclick="loadContent('Convenios/convenios'); return false;">
                    <i class="fi fi-rr-document-signed"></i> CONVENIO
                </button>
                <button type="button" class="lex-btn-premium lex-btn-save" onclick="enviarCliente(event)">
                    <i class="fi fi-rr-disk"></i> GUARDAR CLIENTE
                </button>
            </div>
        </form>
    </div>
</div>

<div class="row justify-content-center mt-4">
  <div class="col-auto">
    <button type="button" class="btn-volver-glass-pro" onclick="loadContent('Clientes/clientes'); return false;">
      <i class="fi fi-br-angle-double-left"></i> <span>VOLVER AL GESTOR</span>
    </button>
  </div>
</div>

<script>
    // Se mantiene toda la lógica funcional intacta
    document.getElementById('fechaRegistro').value = new Date().toISOString().split('T')[0];

    function toggleExpediente(mostrar) {
        const sector = document.getElementById('sectorExpediente');
        if(mostrar) {
            sector.classList.remove('d-none');
            sector.classList.add('animate__animated', 'animate__fadeInDown');
        } else {
            sector.classList.add('d-none');
        }
    }

    function enviarCliente(e) {
        if (e) e.preventDefault(); 
        const btn = e.currentTarget;
        const nombre = document.getElementById('nombreCli').value.trim();

        if (!nombre) {
            Swal.fire({
                icon: 'warning',
                title: 'Dato faltante',
                text: 'Por favor, ingrese el nombre.',
                confirmButtonColor: '#ED6AFF'
            });
            return;
        }

        Swal.fire({
            title: 'Procesando...',
            text: 'Registrando en base de datos LexTech',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        const datos = {
            fecha: document.getElementById('fechaRegistro').value,
            nombre: nombre,
            dni: document.getElementById('dniCli').value,
            tel: document.getElementById('telCli').value,
            email: document.getElementById('emailCli').value,
            domicilio: document.getElementById('domicilioCli').value,
            expediente: document.getElementById('expSi').checked ? 
                        document.getElementById('selectExpedienteCli').value : "SIN VINCULAR"
        };

        google.script.run
            .withSuccessHandler(res => {
                if(res.success) {
                    Swal.fire({ icon: 'success', title: '¡Hecho!', text: 'ID: ' + res.id, timer: 2000, showConfirmButton: false });
                    setTimeout(() => loadContent('Clientes/gestorClientes'), 2000);
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: res.error });
                }
            })
            .guardarCliente(datos);
    }

    // Funciones de carga en cascada (Sin cambios para asegurar funcionalidad)
const PREFIJO_MAP = {
    'MO': 'MORON', 'LM': 'LA MATANZA', 'SI': 'SAN ISIDRO', 'SM': 'SAN MARTIN',
    'MZ': 'MERCEDES LUJÁN', 'CA': 'CABA', 'AV': 'AVELLANEDA', 
    'MGRZ': 'MORENO GRAL RODRIGUEZ', 'LZ': 'LOMAS DE ZAMORA' 
};

function cargarFuerosCli() {
    const tipo = document.getElementById('selectRamaCli').value;
    const f = document.getElementById('selectFueroCli');
    if(!tipo) return;

    f.innerHTML = '<option>Cargando...</option>'; f.disabled = true;
    google.script.run.withSuccessHandler(fueros => {
        f.innerHTML = '<option value="" selected disabled>-- Seleccione Fuero --</option>';
        fueros.forEach(name => f.add(new Option(name, name)));
        f.disabled = false;
    }).getFuerosDesdeDrive(tipo);
}

function cargarDeptosCli() {
    const tipo = document.getElementById('selectRamaCli').value;
    const fuero = document.getElementById('selectFueroCli').value;
    const d = document.getElementById('selectDeptoCli');
    
    d.innerHTML = '<option>Cargando...</option>'; d.disabled = true;
    google.script.run.withSuccessHandler(deps => {
        d.innerHTML = '<option value="" selected disabled>-- Seleccione Depto --</option>';
        deps.forEach(prefijo => {
            const nombreCompleto = PREFIJO_MAP[prefijo] || prefijo;
            d.add(new Option(nombreCompleto, prefijo));
        });
        d.disabled = false;
    }).getDepartamentosJudiciales(fuero, tipo);
}

function cargarJuzgadosCli() {
    const tipo = document.getElementById('selectRamaCli').value;
    const fuero = document.getElementById('selectFueroCli').value;
    const depto = document.getElementById('selectDeptoCli').value;
    const j = document.getElementById('selectJuzgadoCli');

    j.innerHTML = '<option>Buscando Juzgados...</option>'; j.disabled = true;
    google.script.run.withSuccessHandler(archivos => {
        j.innerHTML = '<option value="" selected disabled>-- Seleccione Juzgado --</option>';
        archivos.forEach(a => j.add(new Option(a.name, a.id)));
        j.disabled = false;
    }).getExpedientesFromDrive(fuero, depto, tipo);
}

function cargarExpedientesCli() {
    const ssId = document.getElementById('selectJuzgadoCli').value;
    const e = document.getElementById('selectExpedienteCli');

    e.innerHTML = '<option>Leyendo listado...</option>'; e.disabled = true;
    google.script.run.withSuccessHandler(lista => {
        e.innerHTML = '<option value="" selected disabled>-- Seleccione Expediente --</option>';
        lista.forEach(nombre => e.add(new Option(nombre, nombre)));
        e.disabled = false;
    }).getListaExptesdeId(ssId);
}
</script>
