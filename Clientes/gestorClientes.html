  <div class="col-auto">

<script>
(function() {
    console.log("KARDEX: Iniciando sincronización...");
    cargarKardexPremium();
})();

function cargarKardexPremium() {
    const container = document.getElementById('contenedorKardex');
    if (!container) return;

    console.log("--- LOG DE RASTREO ---");

    google.script.run.withSuccessHandler(idConf => {
        console.log("TRAZA: El backend apunta al ID: " + idConf);
    }).obtenerConfiguracionId(); 

    google.script.run
        .withSuccessHandler(clientes => {
            console.log("TRAZA: Datos crudos recibidos:", clientes);

            container.innerHTML = ''; 
            if (clientes === null) {
                console.error("TRAZA: Error Crítico - El servidor devolvió NULL");
                container.innerHTML = `<div class="alert alert-warning text-center">Error: El servidor no respondió. Revisa los permisos del Script.</div>`;
                return;
            }

            if (clientes.length > 0 && clientes[0].nombre === "ERROR DE CARGA") {
                container.innerHTML = `<div class="alert alert-danger text-center"><strong>Error:</strong> ${clientes[0].expediente}</div>`;
                return;
            }

            if (clientes.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fi fi-rr-box-open fs-1"></i>
                        <h5 class="mt-3 text-muted">Archivo de clientes vacío</h5>
                        <p>No hay datos en la hoja <strong>baseClientes</strong>.</p>
                        <button class="lex-btn-premium" onclick="loadContent('Clientes/nuevoCliente')">REGISTRAR PRIMER CLIENTE</button>
                    </div>`;
                return;
            }

            // Renderiza tarjetas
    clientes.forEach(cli => {
            const cardHtml = `
              <div class="card-item-cli"> <div class="kardex-ficha">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="n-badge-id">
                        <i class="fi fi-rr-id-badge"></i> ${cli.id}
                    </span>
                    <i class="fi fi-sr-star-octagon n-icon-star"></i>
                </div>

                <h6 class="n-title-bordo mb-3 text-uppercase">${cli.nombre}</h6>
                
                <div class="expediente-badge mb-3">
                    <small class="d-block opacity-75" style="font-size: 0.6rem;">EXPEDIENTE VINCULADO</small>
                    <div class="fw-bold text-truncate">
                        <i class="fi fi-rr-folder-open me-1"></i> ${cli.expediente}
                    </div>
                </div>

                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <div class="small n-text-bordo">
                        <i class="fi fi-rr-phone-call me-1"></i> ${cli.tel}
                    </div>
                    <button class="btn-neu-press" onclick="loadContent('Convenios/convenios')">
                        CONVENIOS <i class="fi fi-rr-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>`;
            container.innerHTML += cardHtml;
        });
            console.log("TRAZA: Renderizado exitoso.");
        })
        .withFailureHandler(err => {
            console.error("Fallo crítico:", err);
            container.innerHTML = "Error de conexión con el servidor.";
        })
        .obtenerClientes();
}

function formatearFecha(fechaStr) {
    if(!fechaStr || fechaStr === "") return '---';
    try {
        const fecha = new Date(fechaStr);
        if (isNaN(fecha)) return fechaStr; // Retorna el string original si no es fecha
        return fecha.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch(e) { return fechaStr; }
}

window.filtrarKardex = function() {
    const q = document.getElementById('buscarCliente').value.toLowerCase();
    document.querySelectorAll('.card-item-cli').forEach(card => {
        const busqueda = card.getAttribute('data-search');
        card.style.display = busqueda.includes(q) ? 'block' : 'none';
    });
}
</script>
